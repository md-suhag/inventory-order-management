        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdate' }
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Supplier' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
