        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    Password:
      type: string
      minLength: 8
      description: 8+ characters, at most 72 bytes (bcrypt limit), at least one letter and one digit.
      example: Welcome123

    RefreshTokenBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: JWT (HS256) }
        accessTokenExpiresIn: { type: integer, description: Seconds, example: 900 }
        refreshToken: { type: string, description: Opaque, 43 characters }
        refreshTokenExpiresAt: { type: string, format: date-time }

    Session:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user: { $ref: '#/components/schemas/User' }

    RoleRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: MANAGER }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/RoleRef' }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            permissions:
              type: array
              items: { type: string }
              example: [dashboard.read, orders.read, orders.manage, orders.confirm]

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Warehouse }
        description: { type: string, nullable: true }
        isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
          example: [inventory.read, purchases.receive]
        userCount: { type: integer, example: 3 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DashboardSummary:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string, example: Asia/Dhaka }
        counts:
          type: object
          properties:
            activeProducts: { type: integer }
            activeCustomers: { type: integer }
            activeSuppliers: { type: integer }
        orders:
          type: object
          properties:
            createdInRange:
              type: object
              properties:
                DRAFT: { type: integer }
                CONFIRMED: { type: integer }
                COMPLETED: { type: integer }
                CANCELLED: { type: integer }
            pending: { type: integer, description: Orders currently CONFIRMED }
            drafts: { type: integer, description: Orders currently DRAFT }
        stock:
          type: object
          properties:
            lowStock: { type: integer }
            outOfStock: { type: integer }
            items:
              type: array
              description: Up to 10 out-of-stock / low-stock products, lowest stock first
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: string }
                  name: { type: string }
                  stockQuantity: { type: integer }
                  lowStockThreshold: { type: integer }
                  stockState: { type: string, enum: [LOW, OUT] }
        recentOrders:
          type: array
          description: Latest 5 orders (only with orders.read)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              orderNumber: { type: string }
              status: { type: string }
              paymentStatus: { type: string }
              totalAmount: { type: string }
              customerName: { type: string, nullable: true }
              customer: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
              createdAt: { type: string, format: date-time }
        recentPurchases:
          type: array
          description: Latest 5 purchases (only with purchases.read)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              purchaseNumber: { type: string }
              status: { type: string }
              paymentStatus: { type: string }
              totalAmount: { type: string }
              supplier: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
              createdAt: { type: string, format: date-time }
        financials:
          type: object
          description: Only with dashboard.financials (BUSINESS_RULES §9)
          properties:
            inventoryValue: { type: string, example: '1250.00' }
            outstandingCustomerBalance: { type: string, example: '0.00' }
            outstandingSupplierBalance: { type: string, example: '0.00' }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Beverages }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        productCount: { type: integer, example: 12 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [sku, name, sellingPrice]
      properties:
        sku: { type: string, maxLength: 64, description: 'Trimmed and upper-cased; unique' }
        name: { type: string, minLength: 1, maxLength: 200 }
        sellingPrice: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        barcode: { type: string, maxLength: 64, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        unit: { type: string, maxLength: 20, default: pcs }
        costPrice: { type: string, pattern: '^\d{1,10}(\.\d{1,4})?$', description: 'Requires products.view_cost' }
        taxRate: { type: string, nullable: true, description: '0–100; null = business default rate' }
        reorderLevel: { type: integer, minimum: 0, nullable: true, description: 'null = business default threshold' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        openingStock: { type: integer, minimum: 0 }

    ProductUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        sellingPrice: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        barcode: { type: string, maxLength: 64, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        unit: { type: string, maxLength: 20, default: pcs }
        costPrice: { type: string, pattern: '^\d{1,10}(\.\d{1,4})?$', description: 'Requires products.view_cost' }
        taxRate: { type: string, nullable: true, description: '0–100; null = business default rate' }
        reorderLevel: { type: integer, minimum: 0, nullable: true, description: 'null = business default threshold' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, example: TEA-01 }
        barcode: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        unit: { type: string, example: pcs }
        costPrice: { type: string, example: '80.5' }
        sellingPrice: { type: string, example: '120' }
        taxRate: { type: string, nullable: true }
        stockQuantity: { type: integer }
        reorderLevel: { type: integer, nullable: true }
        lowStockThreshold: { type: integer, description: 'reorderLevel or the business default' }
        stockState: { type: string, enum: [IN_STOCK, LOW, OUT] }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        category:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            status: { type: string, enum: [ACTIVE, ARCHIVED] }
        primaryImageId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer }
        sortOrder: { type: integer, description: '0 = primary' }
        createdAt: { type: string, format: date-time }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            images:
              type: array
              items: { $ref: '#/components/schemas/ProductImage' }
            recentMovements:
              type: array
              description: Latest 10 movements
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [OPENING_STOCK, PURCHASE_RECEIPT, SALE, SALE_CANCELLATION, SALE_RETURN, ADJUSTMENT_IN, ADJUSTMENT_OUT] }
                  quantityChange: { type: integer }
                  previousStock: { type: integer }
                  resultingStock: { type: integer }
                  unitCost: { type: string, description: 'Only with products.view_cost' }
                  adjustmentReason: { type: string, nullable: true }
                  notes: { type: string, nullable: true }
                  createdAt: { type: string, format: date-time }
                  performedBy:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }

    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 2000, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }
        contactPerson: { type: string, maxLength: 100, nullable: true }

    SupplierUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 2000, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }
        contactPerson: { type: string, maxLength: 100, nullable: true }

    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        contactPerson: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SupplierDetail:
      allOf:
        - $ref: '#/components/schemas/Supplier'
        - type: object
          properties:
            summary:
              type: object
              properties:
                purchaseCount: { type: integer }
                totalPurchased: { type: string, example: '0.00' }
                totalPaid: { type: string, example: '0.00' }
                outstandingBalance: { type: string, example: '0.00' }

    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 2000, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }

    CustomerUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 2000, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            summary:
              type: object
              properties:
                orderCount: { type: integer }
                totalSales: { type: string, example: '0.00' }
                totalPaid: { type: string, example: '0.00' }
                outstandingBalance: { type: string, example: '0.00' }

    PermissionInfo:
      type: object
      properties:
        key: { type: string }
        module: { type: string }
        description: { type: string }

    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 57 }
        totalPages: { type: integer, example: 3 }

    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            requestId: { type: string }

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details: [{ field: email, message: Invalid email address }]
              requestId: 3f1c2a9e-…
    Unauthenticated:
      description: Missing, invalid or expired access token (`UNAUTHENTICATED`, `INVALID_TOKEN`, `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: TOKEN_EXPIRED, message: Access token expired, requestId: 3f1c… } }
    InvalidCredentials:
      description: Wrong email/password, unknown account, or locked account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_CREDENTIALS, message: Invalid email or password, requestId: 3f1c… } }
    InvalidToken:
      description: Refresh token invalid, expired, revoked or reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_TOKEN, message: Invalid or expired refresh token, requestId: 3f1c… } }
    AccountInactive:
      description: The account is deactivated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: ACCOUNT_INACTIVE, message: Account is deactivated, requestId: 3f1c… } }
    Forbidden:
      description: Authenticated but lacking the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: You do not have permission to perform this action, requestId: 3f1c… } }
    Duplicate:
      description: Unique constraint conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: DUPLICATE, message: An account with this email already exists, requestId: 3f1c… } }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: RATE_LIMITED, message: 'Too many authentication attempts, please try again later', requestId: 3f1c… } }
    PayloadTooLarge:
      description: Request or uploaded file too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Referenced:
      description: The record is still referenced by other records
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: REFERENCED, message: Role is assigned to 2 user(s); reassign them first, requestId: 3f1c… } }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: User not found, requestId: 3f1c… } }
    BusinessRuleOrValidation:
      description: Field validation (`VALIDATION_ERROR`), unknown referenced id (`INVALID_REFERENCE`) or business rule violation (`BUSINESS_RULE_VIOLATION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: BUSINESS_RULE_VIOLATION, message: At least one active administrator must remain, requestId: 3f1c… } }
