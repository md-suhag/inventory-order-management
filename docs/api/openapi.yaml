openapi: 3.0.3
info:
  title: Mini Inventory & Order Management API
  version: 0.1.0
  description: |
    REST API for the Mini Inventory & Order Management System.

    * Conventions (envelopes, pagination, sorting, errors, idempotency): see `docs/api/API_DESIGN.md`.
    * Authentication: `Authorization: Bearer <accessToken>` obtained from `POST /auth/login`.
    * Every protected operation lists its required permission under `x-permission`.
    * Money values are strings with 2 decimals (e.g. `"1250.50"`); quantities are integers.

    This spec is written by hand and kept in sync with the code by an automated test
    that compares it with the registered Express routes.
servers:
  - url: /api/v1
    description: Current server
tags:
  - name: Health
  - name: Auth
    description: Login, session tokens, profile and password management
  - name: Users
    description: User administration (accounts, roles, activation)
  - name: Roles
    description: Roles and the permission catalogue
  - name: Dashboard
    description: Operational and financial dashboard figures
  - name: Categories
    description: Product categories
  - name: Products
    description: Product catalogue, stock state and images
  - name: Suppliers
    description: Suppliers and their purchase balances
  - name: Customers
    description: Customers and their order balances

security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              example: { status: ok, uptimeSeconds: 42 }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks database connectivity)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              example: { status: ok, checks: { database: ok } }
        '503':
          description: Database unreachable
          content:
            application/json:
              example: { status: unavailable, checks: { database: unreachable } }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        Returns a 15-minute access token and a 7-day rotating refresh token.
        After 5 consecutive failures the account is locked for 15 minutes; locked, unknown-email and
        wrong-password attempts all return the same `401 INVALID_CREDENTIALS`.
        Rate limit: 10 requests/minute/IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254, description: Case-insensitive }
                password: { type: string, minLength: 1, maxLength: 200 }
            example: { email: admin@example.com, password: ChangeMe123! }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        The presented refresh token is revoked and replaced. Re-using an already rotated token
        (after a 10-second grace window for parallel requests) is treated as theft: the whole
        session family is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke the session's refresh-token family)
      description: Idempotent — always returns 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '204': { description: Logged out }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out of all sessions
      description: Revokes every refresh token of the user and invalidates all outstanding access tokens.
      responses:
        '204': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register (only when enabled in business settings)
      description: Creates an **inactive** STAFF account that an administrator must activate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$' }
                password: { $ref: '#/components/schemas/Password' }
            example: { name: Rahim Uddin, email: rahim@example.com, password: Welcome123 }
      responses:
        '201':
          description: Registered (pending activation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      message: { type: string }
        '403':
          description: Self-registration is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: REGISTRATION_DISABLED, message: Self-registration is disabled; ask an administrator for an account, requestId: 3f1c… } }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Always returns 202 with the same message (no account enumeration). If an active account
        exists, a single-use link valid for 30 minutes is emailed. Rate limit: 5 requests/hour/IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              example: { data: { message: 'If an active account exists for this email, a password reset link has been sent.' } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using the emailed token
      description: Consumes the token, clears any lockout and revokes all sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 20, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed }
        '400':
          description: Token invalid, used or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: INVALID_TOKEN, message: This password reset link is invalid or has expired, requestId: 3f1c… } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user with effective permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Auth]
      summary: Update own profile (name, phone)
      description: Email, role and status cannot be changed here (unknown fields are ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, nullable: true, pattern: '^[0-9+()\-\s]{5,30}$' }
            example: { name: Jane Manager, phone: '+880 1711-000000' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: Revokes every session (including other devices) and returns a fresh token pair for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users:
    get:
      tags: [Users]
      summary: List users
      x-permission: users.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Case-insensitive match on name or email
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: 'Up to 3 keys from: name, email, createdAt, lastLoginAt (default createdAt:desc)'
          schema: { type: string, example: 'name:asc' }
        - name: roleId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Users]
      summary: Create a user
      description: |
        Creates an active user with an initial password (shared out of band; the user can change it or
        use the reset flow). Only an administrator can create a user with the ADMIN role.
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, roleId, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, description: Stored lower-cased }
                phone: { type: string, pattern: '^[0-9+()\-\s]{5,30}$' }
                roleId: { type: string, format: uuid }
                password: { $ref: '#/components/schemas/Password' }
            example: { name: Sam Staff, email: sam@example.com, roleId: 0190f3a0-1111-7000-8000-000000000000, password: Welcome123 }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Get a user
      x-permission: users.read
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update a user (name, phone, role)
      description: |
        Changing the role revokes all sessions of that user. `BUSINESS_RULE_VIOLATION` when changing your
        own role or demoting the last active administrator. Only administrators can modify administrator
        accounts or assign the ADMIN role (`FORBIDDEN`). Email cannot be changed (unknown fields are ignored).
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, nullable: true, pattern: '^[0-9+()\-\s]{5,30}$' }
                roleId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }

  /users/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Users]
      summary: Activate a user
      description: Idempotent. Also clears a login lockout.
      x-permission: users.manage
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Users]
      summary: Deactivate a user
      description: |
        Idempotent. Revokes all sessions immediately. `BUSINESS_RULE_VIOLATION` for your own account or
        the last active administrator.
      x-permission: users.manage
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }

  /roles/permissions:
    get:
      tags: [Roles]
      summary: Permission catalogue
      x-permission: roles.read
      responses:
        '200':
          description: All permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionInfo' }
              example:
                data:
                  - { key: orders.confirm, module: orders, description: Confirm orders (deducts stock) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /roles:
    get:
      tags: [Roles]
      summary: List roles with permissions and user counts
      description: The system ADMIN role always reports every permission (implicit full access).
      x-permission: roles.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Case-insensitive match on name or description
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: 'Up to 3 keys from: name, createdAt (default name:asc)'
          schema: { type: string }
      responses:
        '200':
          description: Page of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Roles]
      summary: Create a custom role
      description: |
        Names are unique case-insensitively. A caller who is not an administrator can only grant
        permissions they hold themselves (`FORBIDDEN`).
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z0-9][A-Za-z0-9 _-]*$' }
                description: { type: string, maxLength: 255, nullable: true }
                permissions:
                  type: array
                  items: { type: string }
                  description: Permission keys from `GET /roles/permissions`; duplicates are ignored
            example: { name: Warehouse, description: Receiving team, permissions: [inventory.read, purchases.receive] }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Roles]
      summary: Get a role
      x-permission: roles.read
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Roles]
      summary: Update a role (name, description, permission set)
      description: |
        `permissions` replaces the whole set; holders get the change on their next request.
        `BUSINESS_RULE_VIOLATION`: the ADMIN role is immutable and system roles cannot be renamed.
        A caller who is not an administrator cannot edit their own role or grant permissions they lack (`FORBIDDEN`).
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                description: { type: string, maxLength: 255, nullable: true }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }
    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: System roles cannot be deleted (`BUSINESS_RULE_VIOLATION`); a role still held by users returns `409 REFERENCED`.
      x-permission: roles.manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Referenced' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Operational dashboard summary
      description: "Counts, order status in range, pending/draft orders, low/out-of-stock alerts (FR-DASH-01..05). `recentOrders` needs `orders.read`, `recentPurchases` needs `purchases.read`, `financials` needs `dashboard.financials`; sections the caller may not see are omitted. Net sales, gross profit and purchase value tiles arrive with the order/purchase modules."
      x-permission: dashboard.read
      parameters:
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD) in the business timezone; default first day of the current month
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date; default last day of the current month
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories:
    get:
      tags: [Categories]
      summary: List categories with product counts
      x-permission: categories.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Case-insensitive match on name or description
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: 'Up to 3 keys from: name, createdAt, productCount (default name:asc)'
          schema: { type: string }
        - name: status
          in: query
          description: Comma list or repeated
          schema: { type: string, example: 'ACTIVE' }
      responses:
        '200':
          description: Page of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Categories]
      summary: Create a category
      description: Names are unique case-insensitively.
      x-permission: categories.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
            example: { name: Beverages, description: Cold drinks and juices }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categories]
      summary: Get a category
      x-permission: categories.read
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Categories]
      summary: Rename / describe a category
      description: Send `description` as an empty string or null to clear it.
      x-permission: categories.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Delete an unused category
      description: Returns `409 REFERENCED` while any product references it — archive it instead.
      x-permission: categories.manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Referenced' }

  /categories/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Categories]
      summary: Archive a category
      description: Idempotent. Archived categories cannot be assigned to products; existing products keep the reference.
      x-permission: categories.manage
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Categories]
      summary: Unarchive a category
      description: Idempotent.
      x-permission: categories.manage
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Products]
      summary: List products
      description: "`costPrice` is omitted unless the caller holds `products.view_cost`."
      x-permission: products.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Case-insensitive match on name, SKU or barcode
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: 'Up to 3 keys from: name, sku, sellingPrice, stockQuantity, createdAt (default name:asc)'
          schema: { type: string }
        - name: status
          in: query
          description: 'Comma list or repeated: ACTIVE, INACTIVE, ARCHIVED'
          schema: { type: string }
        - name: stockState
          in: query
          description: 'Comma list or repeated: IN_STOCK, LOW, OUT (BR-PROD-04)'
          schema: { type: string, example: 'LOW,OUT' }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: Create a product
      description: "Optional `openingStock` is recorded as an OPENING_STOCK movement at `costPrice` (FR-PROD-02). Sending `costPrice` requires `products.view_cost` (403 otherwise). The category must be active."
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
            example: { sku: TEA-01, name: Green Tea, sellingPrice: '120.00', costPrice: '80.50', openingStock: 25 }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Get a product with images and recent stock movements
      description: "Cost fields (`costPrice`, movement `unitCost`) only with `products.view_cost`."
      x-permission: products.read
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProductDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update a product
      description: "Stock cannot be edited (BR-INV-01; unknown fields → 422). Changing `costPrice` requires `products.view_cost`. Archived products must be unarchived before `status` changes (409 INVALID_STATE_TRANSITION)."
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Products]
      summary: Delete a product without history
      description: Returns `409 REFERENCED` once the product has purchase lines, order lines or stock movements — archive it instead (BR-PROD-02).
      x-permission: products.manage
      responses:
        '204': { description: Deleted (images removed) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Referenced' }

  /products/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Products]
      summary: Archive a product
      description: Idempotent. Archived products stay in history but cannot be used on new documents.
      x-permission: products.manage
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Products]
      summary: Unarchive a product (sets ACTIVE)
      description: Idempotent.
      x-permission: products.manage
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/images:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Products]
      summary: Upload product images
      description: "Multipart field `images` (1–5 files). JPEG, PNG or WebP verified by magic bytes (the sent content type is ignored), ≤ 2 MB each, at most 5 images per product (FR-PROD-07, NFR-SEC-10). Returns all images of the product in display order."
      x-permission: products.manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Images of the product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductImage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/BusinessRuleOrValidation' }

  /products/{id}/images/order:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Products]
      summary: Reorder product images
      description: "`imageIds` must list every image of the product exactly once; the first becomes the primary image."
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Images in the new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductImage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Products]
      summary: Download an image
      description: Served with the stored content type and `X-Content-Type-Options nosniff`.
      x-permission: products.read
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete an image
      description: Remaining images are renumbered; the file is removed from storage.
      x-permission: products.manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /suppliers:
    get:
      tags: [Suppliers]
      summary: List suppliers
      x-permission: suppliers.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Case-insensitive match on name, contact person, phone or email
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: 'Up to 3 keys from: name, createdAt (default name:asc)'
          schema: { type: string }
        - name: status
          in: query
          description: Comma list or repeated
          schema: { type: string, example: 'ACTIVE' }
      responses:
        '200':
          description: Page of suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Supplier' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Suppliers]
      summary: Create a supplier
