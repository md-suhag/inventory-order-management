      summary: Unarchive a customer
      description: Idempotent.
      x-permission: customers.archive
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
